# Phoenix charge limiter configuration.
#
# Goal: run the phone from the adapter and keep the cell off its maximum
# resting voltage, so the battery behaves as a UPS instead of cycling.
#
# Two control modes:
#
#   inhibit-charge (kernel patch 0010; used when float control is unavailable
#   or FLOAT_CONTROL=0)
#       Voltage hysteresis between START_VOLTAGE_UV and STOP_VOLTAGE_UV via
#       charge_behaviour.  Measured on this hardware: with a good adapter path
#       the cell stays idle (about +0.4 mA) while the adapter carries the
#       system; through a marginal path (about 1 ohm of cable) USBIN settles
#       near its 50 mA floor and the battery supplies most of the load, so the
#       adapter-deficit guard below releases the inhibit rather than let the
#       cell drain unnoticed.
#
#   float voltage (default when the kernel has patches 0018+0019)
#       STOP_VOLTAGE_UV is programmed as the charger's float ceiling and
#       charging stays enabled.  Measured on this hardware: above the ceiling
#       the cell carries the system down to it (input drops to ~5 mA); at the
#       ceiling the adapter carries the system and the cell holds within about
#       1 mA (4.5 hours observed at a 4.10 V ceiling).  START_VOLTAGE_UV is
#       unused.  Without patch 0019 the SMB5 register is encoded as SMB2 and a
#       4.10 V request becomes 4.41 V.
#       The limiter only ever LOWERS the ceiling.  A ceiling already below the
#       target (firmware, another controller, or a previous lower setting) is
#       left alone, so after raising STOP_VOLTAGE_UV or setting FLOAT_CONTROL
#       back to 0, run `systemctl start phoenix-charge-cap-reset.service` to
#       restore the original ceiling; the next timer run applies the change.
#
# qcom_qg estimates capacity linearly from voltage, so these are voltage
# thresholds, not a calibrated 80% state of charge.
START_VOLTAGE_UV=4000000
STOP_VOLTAGE_UV=4100000

# 1 = use float-voltage control when the kernel exposes constant_charge_voltage;
# 0 = always use inhibit-charge.
FLOAT_CONTROL=1

# Adapter-deficit guard (inhibit-charge mode only).  A sustained discharge this
# large while the charger reports input online means the inhibit is being paid
# for out of the battery; release it and log.  A missing current channel proves
# nothing and never releases an inhibit.
DEFICIT_CURRENT_UA=20000
DEFICIT_SAMPLES=5
DEFICIT_LOCKOUT_SECONDS=1800
