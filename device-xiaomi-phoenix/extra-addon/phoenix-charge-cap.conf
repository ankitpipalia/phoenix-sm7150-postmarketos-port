# Phoenix charge limiter configuration.
#
# Goal: run the phone from the adapter and keep the cell off its maximum
# resting voltage, so the battery behaves as a UPS instead of cycling.
#
# Two control modes, selected automatically:
#
#   float voltage (preferred, needs kernel patch 0018)
#       STOP_VOLTAGE_UV is programmed as the charger's float ceiling.  Charging
#       stays enabled, the charger keeps regulating, the adapter carries the
#       system, and the cell rests at the ceiling with taper current near zero.
#       START_VOLTAGE_UV is unused: the PMIC's own recharge threshold applies.
#
#   inhibit-charge (fallback, kernel patch 0010)
#       Used only when constant_charge_voltage is not writable.  Measured on
#       this hardware, inhibiting at a high cell voltage does NOT give
#       adapter-only operation -- USBIN settles near its 50 mA floor and the
#       battery supplies most of the load -- so the adapter-deficit guard below
#       releases the inhibit rather than let the cell drain unnoticed.
#
# qcom_qg estimates capacity linearly from voltage, so these are voltage
# thresholds, not a calibrated 80% state of charge.
START_VOLTAGE_UV=4000000
STOP_VOLTAGE_UV=4100000

# Adapter-deficit guard (fallback mode only).  A sustained discharge this large
# while the charger reports input online means the inhibit is being paid for
# out of the battery; release it and log.  A missing current channel proves
# nothing and never releases an inhibit.
DEFICIT_CURRENT_UA=20000
DEFICIT_SAMPLES=5
DEFICIT_LOCKOUT_SECONDS=1800
