# Phoenix LLM manager configuration.
# The web UI and management API listen on the LAN. Set API_TOKEN before using
# the device on an untrusted network; the browser accepts it from the Settings
# panel and keeps it in sessionStorage only.
BIND_HOST=0.0.0.0
MANAGER_PORT=7070
API_TOKEN=
MODEL_PATH=/home/user/models/Spark-X2.5-1.7B-Q8_0.gguf
LLAMA_SERVER=/home/user/opt/llama-spark-turboquant/bin/llama-server
RUNTIME_HOST=127.0.0.1
RUNTIME_PORT=8080
MIN_AVAILABLE_MIB=768
STARTUP_TIMEOUT_SECONDS=180
SHUTDOWN_TIMEOUT_SECONDS=20
THERMAL_WARN_C=80
THERMAL_CRITICAL_C=92
LOG_PATH=/var/lib/phoenix-llm/runtime.log
STATE_PATH=/var/lib/phoenix-llm/state.json
