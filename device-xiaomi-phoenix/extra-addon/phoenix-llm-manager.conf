# Phoenix LLM manager configuration.
# The web UI and management API listen on the LAN. Set API_TOKEN before using
# the device on an untrusted network; the browser accepts it from the Settings
# panel and keeps it in sessionStorage only.
BIND_HOST=0.0.0.0
MANAGER_PORT=7070
API_TOKEN=
MODEL_PATH=/home/user/models/Spark-X2.5-1.7B-Q8_0.gguf
LLAMA_SERVER=/home/user/opt/llama-spark-turboquant/bin/llama-server
RUNTIME_HOST=127.0.0.1
RUNTIME_PORT=8080
MIN_AVAILABLE_MIB=768
STARTUP_TIMEOUT_SECONDS=180
SHUTDOWN_TIMEOUT_SECONDS=20
THERMAL_WARN_C=80
THERMAL_CRITICAL_C=92
LOG_PATH=/var/lib/phoenix-llm/runtime.log
STATE_PATH=/var/lib/phoenix-llm/state.json
# Refuse to start inference unless the charger reports input online, and unless
# the cell is above this floor.  Heavy inference can pull -58 mA from the cell
# even on a good adapter, and on battery alone it empties the pack in about an
# hour.  Set REQUIRE_EXTERNAL_POWER=0 only for a deliberate on-battery test.
REQUIRE_EXTERNAL_POWER=1
MIN_BATTERY_UV=3700000
# runtime.log is rotated to runtime.log.1 before a start once it exceeds this.
LOG_MAX_BYTES=8388608
