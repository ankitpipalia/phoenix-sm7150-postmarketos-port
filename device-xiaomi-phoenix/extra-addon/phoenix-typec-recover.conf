# phoenix-typec-recover config - voltage is primary, capacity is legacy fallback
#
# Voltage threshold below which stuck-as-source is considered urgent.
VOLTAGE_THRESHOLD_UV=3600000
# Legacy capacity fallback only used when voltage is unreadable.
CAP_THRESHOLD=30
# How long to wait before re-checking stuck state after initial detection (seconds)
PERSIST_SEC=0
# Shared lock with usb-host-wake
LOCK_FILE=/run/lock/phoenix-usb-role.lock
POWER_SUPPLY_ROOT=/sys/class/power_supply
TYPEC_ROOT=/sys/class/typec
